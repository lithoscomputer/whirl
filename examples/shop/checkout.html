<!doctype html><html lang="en"><meta charset="utf-8"><title>Checkout</title><style>body{font:18px system-ui;max-width:640px;margin:64px auto;padding:24px;color:#172c35;background:#f4f6f7}label{display:block;margin:18px 0}input{display:block;padding:10px;margin-top:6px}button{padding:12px 24px;background:#164f53;color:white;border:0;border-radius:6px}[role=alert]{color:#ac2929}</style>
<h1>Checkout</h1><p data-testid="user">demo@example.com</p><p>One blue widget — $12</p>
<form id="checkout" novalidate>
<label>Shipping address<input id="address" autocomplete="street-address"></label>
<p role="alert" id="error" hidden></p><button>Place order</button>
</form><p role="status" id="status"></p><a href="/preview">Preview widget</a>
<script>
document.querySelector('#checkout').addEventListener('submit', event => {
  event.preventDefault();
  const address = document.querySelector('#address').value.trim();
  const error = document.querySelector('#error');
  error.hidden = address.length > 0;
  error.textContent = address ? '' : 'Enter a shipping address';
  document.querySelector('#status').textContent = address ? 'Order confirmed. Ship to ' + address : '';
});
</script></html>
