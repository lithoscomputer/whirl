<?xml version="1.0" encoding="UTF-8"?>
<html xmlns="http://www.w3.org/1999/xhtml" lang="en">
<head>
<title>Namespaced markup</title>
</head>
<body>
<h1>Profile</h1>
<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" role="img" aria-label="Avatar"><circle cx="20" cy="20" r="18" fill="teal"/></svg>
<math xmlns="http://www.w3.org/1998/Math/MathML"><mi>x</mi><mo>=</mo><mn>2</mn></math>
<form>
<p><label>Email <input type="email" name="email"/></label></p>
<p><label>Nickname <input name="nickname"/></label></p>
</form>
</body>
</html>
