[tools]
node = "24.19.0"
bun = "1.4.0"

[env]
WHIRL_NODE = "node"
WHIRL_SHIM_JS = "{{config_root}}/shim/dist/index.js"

[tasks.setup]
description = "Install toolchains, shim dependencies, and Playwright browsers"
run = [
  "rustup toolchain install nightly-2026-04-14 --profile minimal --component rustfmt",
  "rustup toolchain install 1.85.0 --profile minimal",
  "cargo nextest --version >/dev/null 2>&1 || cargo install cargo-nextest --locked",
  "mise run setup:shim",
  "cd shim && bun x playwright install chromium",
]

[tasks."setup:shim"]
description = "Install shim dependencies with Bun from the lockfile"
dir = "shim"
sources = ["package.json", "bun.lock"]
outputs = ["node_modules/@playwright/test/package.json"]
run = "{{config_root}}/scripts/quiet.sh bun install --frozen-lockfile"

[tasks."build:shim"]
description = "Build the browser shim from its TypeScript source"
depends = ["setup:shim"]
dir = "shim"
sources = ["src/**/*", "package.json", "bun.lock", "tsconfig.json"]
outputs = ["dist/index.js"]
run = "{{config_root}}/scripts/quiet.sh bun run build"

[tasks.dev]
description = "Build the shim and the whirl binary for local development"
depends = ["build:shim"]
run = "cargo build --workspace"

[tasks.test]
description = "Run all tests (Rust unit, acceptance, and shim)"
depends = ["test:rust", "test:shim"]

[tasks."test:rust"]
description = "Run Rust unit and acceptance tests with nextest"
depends = ["build:shim"]
run = "{{config_root}}/scripts/quiet.sh cargo nextest run --workspace --all-targets --all-features"

[tasks."test:shim"]
description = "Run the shim's own tests"
depends = ["build:shim"]
dir = "shim"
run = "{{config_root}}/scripts/quiet.sh bun run test"

[tasks.check]
description = "Run the routine checks for every pushed revision"
depends = ["check:fmt", "check:clippy", "test", "check:shim"]

[tasks."check:fmt"]
description = "Check Rust formatting with the pinned nightly rustfmt"
run = "{{config_root}}/scripts/quiet.sh cargo +nightly-2026-04-14 fmt --check --all"

[tasks."check:clippy"]
description = "Lint Rust code with Clippy, warnings denied"
env = { CARGO_TARGET_DIR = "{{config_root}}/target/clippy" }
run = "{{config_root}}/scripts/quiet.sh cargo clippy --locked --workspace --all-targets --all-features -- -D warnings"

[tasks."check:shim"]
description = "Type-check and lint the shim TypeScript"
depends = ["setup:shim"]
dir = "shim"
run = ["{{config_root}}/scripts/quiet.sh bun run typecheck", "{{config_root}}/scripts/quiet.sh bun run lint"]

[tasks."check:nightly"]
description = "Run the nightly checks: all browser engines plus the whirl install end-to-end test"
depends = ["build:shim"]
run = [
  "cd shim && {{config_root}}/scripts/quiet.sh bun x playwright install chromium firefox webkit",
  "WHIRL_TEST_ALL_BROWSERS=1 {{config_root}}/scripts/quiet.sh cargo nextest run --workspace --all-targets --all-features --run-ignored all",
]
